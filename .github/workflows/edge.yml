name: edge

# Every push publishes prebuilt binaries as the pre-release "edge-<branch>" (slashes -> dashes),
# so scripts/install-aio.sh downloads vynel instead of compiling it on the server.
on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: edge-${{ github.ref }}
  cancel-in-progress: false # a cancelled publish could leave files of two builds

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Build the web UI (embedded into the binary)
        run: make web && test -f web/dist/index.html
      - name: Build
        run: make build-all VERSION="${GITHUB_SHA::7}"
      - name: Checksums
        run: cd bin && sha256sum vynel-linux-* > SHA256SUMS && cat SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        # The release is never deleted: installers running during a publish would get 404 and
        # fall back to slow source builds. Files are replaced one by one, binaries first and
        # SHA256SUMS last, so a downloader sees either the old or the new checksums; a mismatch
        # in between is retried by the installer.
        run: |
          tag="edge-${GITHUB_REF_NAME//\//-}"
          title="edge: $GITHUB_REF_NAME @ ${GITHUB_SHA::7}"
          notes="Automatic build of \`$GITHUB_REF_NAME\` at ${GITHUB_SHA}. Used by scripts/install.sh."
          git push -f origin "$GITHUB_SHA:refs/tags/$tag"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" bin/vynel-linux-* --clobber
            gh release upload "$tag" bin/SHA256SUMS --clobber
            gh release edit "$tag" --title "$title" --notes "$notes" --prerelease
          else
            gh release create "$tag" bin/vynel-linux-* bin/SHA256SUMS --prerelease --verify-tag --title "$title" --notes "$notes"
          fi
