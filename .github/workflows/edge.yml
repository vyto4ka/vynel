name: edge

# Every push publishes prebuilt binaries as the pre-release "edge-<branch>" (slashes -> dashes),
# so scripts/install-aio.sh downloads vynel instead of compiling it on the server.
on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: edge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Build the web UI (embedded into the binary)
        run: make web && test -f web/dist/index.html
      - name: Build
        run: make build-all VERSION="${GITHUB_SHA::7}"
      - name: Checksums
        run: cd bin && sha256sum vynel-linux-* > SHA256SUMS && cat SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="edge-${GITHUB_REF_NAME//\//-}"
          gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$tag" bin/vynel-linux-* bin/SHA256SUMS \
            --prerelease --target "$GITHUB_SHA" \
            --title "edge: $GITHUB_REF_NAME @ ${GITHUB_SHA::7}" \
            --notes "Automatic build of \`$GITHUB_REF_NAME\` at ${GITHUB_SHA}. Used by scripts/install-aio.sh."
