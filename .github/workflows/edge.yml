name: edge

# Every push publishes prebuilt binaries as the pre-release "edge-<branch>" (slashes -> dashes),
# so scripts/install-aio.sh downloads vynel instead of compiling it on the server.
#
# A push of docs, tests or CI files only builds nothing, and the build's version is the last
# commit that changed code (scripts/code-version.sh): panels offer an update only when the
# binaries really change, not for a README fix.
on:
  push:
    branches: [main, "claude/**"]
    paths-ignore: # keep in step with scripts/code-version.sh
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - "**_test.go"
      - "internal/e2e/**"
      - "**/testdata/**"
      - ".github/workflows/ci.yml"
      - ".claude/**"
      - "scripts/code-version.sh"
      - "scripts/release-key.sh"
      - "scripts/load-memory.sh"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: edge-${{ github.ref }}
  cancel-in-progress: false # a cancelled publish could leave files of two builds

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the code version looks for the last commit that changed code
      - name: Code version
        run: echo "CODE_VERSION=$(scripts/code-version.sh)" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Build the web UI (embedded into the binary)
        run: make web && test -f web/dist/index.html
      - name: Build
        run: make build-all VERSION="$CODE_VERSION"
      - name: Checksums
        # install.sh goes into the signed checksums too: `vynel update` runs it only when the
        # signature and its checksum match.
        run: cp scripts/install.sh bin/install.sh && cd bin && sha256sum vynel-linux-* install.sh > SHA256SUMS && cat SHA256SUMS && echo "$CODE_VERSION" > VERSION
      - name: Sign
        # SHA256SUMS.signed = the checksums plus "# ed25519 <signature>" in one file, uploaded in
        # one go, so a downloader never sees checksums and a signature from different builds.
        env:
          KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "$KEY" ]; then echo "no RELEASE_SIGNING_KEY secret: releases are not signed (scripts/release-key.sh)"; exit 0; fi
          umask 077
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/release.pem"
          openssl pkeyutl -sign -rawin -inkey "$RUNNER_TEMP/release.pem" -in bin/SHA256SUMS -out "$RUNNER_TEMP/sums.sig"
          rm -f "$RUNNER_TEMP/release.pem"
          { cat bin/SHA256SUMS; printf '# ed25519 %s\n' "$(base64 -w0 "$RUNNER_TEMP/sums.sig")"; } > bin/SHA256SUMS.signed
          # The key in scripts/install.sh must match, or every install would fail.
          pub="$(grep -o 'VYNEL_RELEASE_PUBKEY:-[^}]*' scripts/install.sh | cut -d- -f2-)"
          if [ -n "$pub" ]; then
            printf -- '-----BEGIN PUBLIC KEY-----\n%s\n-----END PUBLIC KEY-----\n' "$pub" > "$RUNNER_TEMP/release.pub"
            openssl pkeyutl -verify -pubin -inkey "$RUNNER_TEMP/release.pub" -rawin -in bin/SHA256SUMS -sigfile "$RUNNER_TEMP/sums.sig"
          fi
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        # The release is never deleted: installers running during a publish would get 404 and
        # fall back to slow source builds. Files are replaced one by one, binaries first and
        # SHA256SUMS last, so a downloader sees either the old or the new checksums; a mismatch
        # in between is retried by the installer.
        run: |
          tag="edge-${GITHUB_REF_NAME//\//-}"
          title="edge: $GITHUB_REF_NAME @ $CODE_VERSION"
          notes="Automatic build of \`$GITHUB_REF_NAME\` at ${GITHUB_SHA}. Used by scripts/install.sh."
          git push -f origin "$GITHUB_SHA:refs/tags/$tag"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" bin/vynel-linux-* bin/install.sh --clobber
            gh release upload "$tag" bin/SHA256SUMS --clobber
            if [ -f bin/SHA256SUMS.signed ]; then gh release upload "$tag" bin/SHA256SUMS.signed --clobber; fi
            # VERSION last: panels compare it with what they run, so it must not name a build
            # whose files are not all there yet.
            gh release upload "$tag" bin/VERSION --clobber
            gh release edit "$tag" --title "$title" --notes "$notes" --prerelease
          else
            gh release create "$tag" bin/vynel-linux-* bin/install.sh bin/SHA256SUMS $(ls bin/SHA256SUMS.signed 2>/dev/null) bin/VERSION --prerelease --verify-tag --title "$title" --notes "$notes"
          fi
