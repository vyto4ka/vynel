name: ci

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installer and release scripts
        run: scripts/test-install.sh

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Fetch Xray, build Caddy (old agents) and Pebble (ACME) for integration tests
        run: make xray caddy pebble
      - name: nginx with the stream module
        run: sudo apt-get update -q && sudo apt-get install -y -q nginx libnginx-mod-stream
      - name: Test
        env:
          XRAY_BIN: ${{ github.workspace }}/.cache/xray/xray
          XRAY_LOCATION_ASSET: ${{ github.workspace }}/.cache/xray
          CADDY_BIN: ${{ github.workspace }}/.cache/caddy/caddy
          NGINX_BIN: /usr/sbin/nginx
          PEBBLE_BIN: ${{ github.workspace }}/.cache/pebble/pebble
        run: go test -count=1 -race ./...
      - name: Build
        run: make build-all
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: cd web && pnpm install --frozen-lockfile && pnpm build
