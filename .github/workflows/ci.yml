name: ci

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels its older run. Runs on main all finish: a release
# needs a passing run on its exact commit.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Installer and release scripts
        run: scripts/test-install.sh

  go:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Fetch Xray, build Caddy (old agents) and Pebble (ACME) for integration tests
        run: make xray caddy pebble
      - name: nginx with the stream module
        run: sudo apt-get update -q && sudo apt-get install -y -q nginx libnginx-mod-stream
      - name: Test
        env:
          XRAY_BIN: ${{ github.workspace }}/.cache/xray/xray
          XRAY_LOCATION_ASSET: ${{ github.workspace }}/.cache/xray
          CADDY_BIN: ${{ github.workspace }}/.cache/caddy/caddy
          NGINX_BIN: /usr/sbin/nginx
          PEBBLE_BIN: ${{ github.workspace }}/.cache/pebble/pebble
        run: go test -count=1 -race ./...
      - name: Build
        run: make build-all
      - uses: golangci/golangci-lint-action@v9
        with:
          # Pinned: a new release brings new checks, so it is bumped on purpose, not by itself.
          version: v2.14.0

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: cd web && pnpm install --frozen-lockfile && pnpm i18n:check && pnpm build
