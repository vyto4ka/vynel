name: ci

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Fetch Xray for integration tests
        run: ./scripts/fetch-xray.sh .cache/xray
      - name: Test
        env:
          XRAY_BIN: ${{ github.workspace }}/.cache/xray/xray
          XRAY_LOCATION_ASSET: ${{ github.workspace }}/.cache/xray
        run: go test -count=1 -race ./...
      - name: Build
        run: make build-all
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: cd web && pnpm install --frozen-lockfile && pnpm build
